name: Deploy homework and hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_hub.py --site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 24 Nov 2026: deploy-pages failed on its first try with «No artifacts named github-pages»
      # right after a successful upload (same as vocab-deploy that day; a re-run passes).
      - name: Wait for the artifact to register
        run: sleep 30
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
