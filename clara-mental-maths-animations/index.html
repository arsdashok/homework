<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clara · Mental maths in motion</title>
<style>
:root{--ink:#284238;--green:#276c55;--mint:#dcefe4;--muted:#60776c;--line:#bad5c6;--amber:#965217;--peach:#fae8d0}*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{max-width:1640px;margin:auto;padding:18px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}.brand{font-size:26px}nav{display:flex;gap:12px}button{font:700 26px Arial;color:var(--green);background:white;border:2px solid var(--line);border-radius:14px;padding:11px 22px;min-height:54px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a36c2c;outline-offset:4px}nav button[aria-pressed=true],#play{background:var(--green);color:white;border-color:var(--green)}.sheet{background:#fffefb;border:1px solid #d7e1d8;border-radius:26px;padding:24px 30px}.eyebrow{font-size:26px;color:var(--muted);margin:0 0 8px}h1{font-size:clamp(38px,3.3vw,58px);letter-spacing:-.02em;margin:0 0 16px;font-variant-numeric:tabular-nums}.layout{display:grid;grid-template-columns:minmax(340px,.8fr) minmax(0,1.7fr);gap:24px;align-items:stretch}.working{display:flex;flex-direction:column;justify-content:center;gap:12px}.row{border-left:5px solid transparent;border-radius:0 13px 13px 0;background:#f5f7f2;padding:16px 18px;opacity:.28;transition:background .2s,opacity .2s}.row.shown{opacity:1}.row.active{background:var(--mint);border-color:var(--green)}.row .lab{font-size:26px;color:var(--muted);margin-bottom:9px}.formula{font-size:clamp(28px,2vw,37px);font-weight:700;line-height:1.35;font-variant-numeric:tabular-nums}.formula div{white-space:nowrap}.result{color:var(--green)}.extra{color:var(--amber)}.diagram{background:#f0f7f2;border-radius:20px;position:relative;min-height:375px;display:flex;align-items:center}svg{width:100%;height:auto;display:block;overflow:visible}svg text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.num{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}.label{font-size:40px}.muted{fill:var(--muted)}.green{fill:var(--green)}.amber{fill:var(--amber)}.track{stroke:#b7cfc0;stroke-width:3}.caption{font-size:26px;line-height:1.3;min-height:68px;margin:20px 0 14px}.controls{display:flex;align-items:center;gap:14px}#play{min-width:250px}.scrub{flex:1;display:flex;align-items:center;gap:14px}input[type=range]{width:100%;min-height:44px;accent-color:var(--green);cursor:pointer}#time{font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}.note{font-size:26px;color:var(--muted);margin:14px 0 0}.diagram-note{font-size:21px;color:var(--muted);margin:8px 0 0;text-align:center}.diagram-wrap{display:flex;flex-direction:column;justify-content:center}.quiet{opacity:.2}.visible{opacity:1}.currentresult{color:var(--green)}
@media(min-width:900px) and (max-height:800px){main{padding-top:12px}header{margin-bottom:10px}.sheet{padding:20px 26px}.row{padding:11px 14px}.row .lab{margin-bottom:6px}.diagram{min-height:310px}.caption{margin-top:14px;min-height:66px}h1{font-size:44px;margin-bottom:12px}.note{margin-top:10px}.layout{gap:18px}}
@media(max-width:899px){main{padding:14px}.brand{font-size:20px}button{font-size:20px;padding:10px 15px}.sheet{padding:22px 18px}.eyebrow{font-size:20px}h1{font-size:36px}.layout{grid-template-columns:1fr}.working{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;order:2}.row{padding:10px 8px}.row .lab{font-size:17px}.formula{font-size:19px}.diagram-wrap{order:1}.diagram{min-height:0}.diagram-note{font-size:16px}.caption{font-size:24px;min-height:90px}.note{font-size:18px}.controls{flex-wrap:wrap}#play{min-width:190px}.scrub{flex-basis:100%}#time{font-size:18px}}
@media(max-width:520px){header{display:block}.brand{margin-bottom:12px}nav button{flex:1}.sheet{padding:18px 12px}.eyebrow{font-size:18px}h1{font-size:clamp(24px,6.5vw,34px);white-space:nowrap;min-height:66px}#finalAnswer{display:block}.layout{gap:14px}.working{grid-template-columns:1fr;gap:6px}.row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 10px;border-left-width:4px}.row .lab{font-size:18px;margin:0;max-width:100px}.formula{font-size:22px}.diagram-note{font-size:15px}.caption{font-size:22px;min-height:96px;margin:16px 0 12px}.controls{gap:8px}#play{min-width:0;flex:1}#restart{flex:1}.num{font-size:25px}.label{font-size:22px}.note{font-size:17px}#time{font-size:17px}.diagram{padding:5px 0}}

main{padding-bottom:132px}.controls{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:1640px;background:#fffefb;border-top:2px solid var(--line);padding:16px 48px;box-shadow:0 -5px 22px #233c3110}.note{display:none}
@media(min-width:900px){.layout{grid-template-columns:minmax(370px,.95fr) minmax(0,1.6fr)}.formula{font-size:28px;white-space:nowrap}.formula div{display:inline}.formula div+div{margin-left:5px}.row{padding:14px}.caption{min-height:68px}.diagram-note{font-size:22px}}
@media(max-width:899px){main{padding-bottom:160px}.controls{padding:10px 16px}.controls button{min-height:48px}.scrub{gap:10px}input[type=range]{min-height:34px}}
</style></head><body><main>
<header><div class="brand">Clara · Maths in motion</div><nav aria-label="Choose a method"><button id="addition" aria-pressed="true">Addition</button><button id="subtraction" aria-pressed="false">Subtraction</button></nav></header>
<section class="sheet"><p id="method" class="eyebrow"></p><h1 id="original"></h1><div class="layout"><div class="working" id="working"></div><div class="diagram-wrap"><div class="diagram" id="diagram"></div><p class="diagram-note" id="diagramNote"></p></div></div><p class="caption" id="caption" aria-live="polite"></p><div class="controls"><button id="play">Play animation</button><button id="restart">Start again</button><div class="scrub"><input id="progress" type="range" min="0" max="29000" step="100" value="0" aria-label="Animation position"><span id="time">0:00 / 0:29</span></div></div><p class="note">Pause whenever you like. Move the slider to look again.</p></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('en-GB'),clamp=n=>Math.max(0,Math.min(1,n)),ease=n=>n*n*(3-2*n);
let topic='add',elapsed=0,playing=false,last=0,raf=null,lastCaption='',layout=null;
const total=29000;
const tx=(x,y,v,cls='num',id='',anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}" ${id?`id="${id}"`:''}>${v}</text>`;
const ln=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="track"/>`;
function svg(body,w,h,label){return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#276c55"/></marker><marker id="amberArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#965217"/></marker></defs>${body}</svg>`}
function path(d,id,color='#276c55',width=5){return `<path id="${id}" d="${d}" fill="none" stroke="${color}" stroke-width="${width}" marker-end="url(#${color==='#965217'?'amberArr':'arr'})"/>`}
function buildAdd(){
 const mobile=window.innerWidth<=520,w=mobile?350:1000,h=mobile?470:450;
 const start=mobile?[80,145]:[110,285],end=mobile?[80,410]:[880,285];
 const ctrl=mobile?[-65,275]:[495,35];
 const ticks=mobile?[[80,230],[80,275],[80,320],[80,365],[80,410]]:[[560,285],[640,285],[720,285],[800,285],[880,285]];
 layout={mobile,start,end,ctrl,ticks};
 let b=`<rect x="${mobile?23:225}" y="14" width="${mobile?304:550}" height="84" rx="16" fill="#fffefb"/>`;
 b+=tx(mobile?175:500,48,'Easier amount','label muted')+tx(mobile?152:458,84,'18,996','num','roundedAmount')+tx(mobile?270:655,84,'+4','label amber','plusFour');
 if(mobile){b+=ln(80,130,80,425)+tx(175,153,'52,400')+tx(175,237,'71,396','num','targetLabel')+tx(175,418,'71,400');b+=`<path d="M70 179l20 -9m-20 22l20 -9" stroke="#60776c" stroke-width="3"/>`;}
 else{b+=ln(75,285,935,285)+tx(110,340,'52,400')+tx(560,340,'71,396','num','targetLabel')+tx(880,340,'71,400');b+=`<path d="M300 295l15 -20m0 20l15 -20" stroke="#60776c" stroke-width="3"/>`;}
 b+=path(`M${start}Q${ctrl} ${end}`,'bigJump');
 b+=tx(mobile?248:500,mobile?181:140,'+19,000','num green','jumpLabel');
 ticks.forEach(([x,y],i)=>{b+=mobile?ln(x-8,y,x+8,y):ln(x,y-9,x,y+9);if(i>0&&i<4&&mobile)b+=tx(175,y+8,fmt(71396+i),'label muted');});
 for(let k=0;k<4;k++){let a=ticks[4-k],z=ticks[3-k],c=mobile?[a[0]+73,(a[1]+z[1])/2]:[(a[0]+z[0])/2,a[1]-100];b+=path(`M${a}Q${c} ${z}`,'back'+k,'#965217',4);}
 b+=tx(mobile?254:720,mobile?307:226,'−4','num amber','backLabel');
 b+=`<circle id="marker" cx="${start[0]}" cy="${start[1]}" r="${mobile?8:11}" fill="#276c55" stroke="#fffefb" stroke-width="3"/>`;
 if(!mobile)b+=tx(720,399,'4 × one step back','label muted');
 $('diagram').innerHTML=svg(b,w,h,'Add four to 18,996, add the easier 19,000, then move back four from 71,400 to 71,396.');
 $('diagramNote').textContent=mobile?'The final four unit steps are enlarged.':'Sketch, not to scale. Each small jump takes away 1.';
 for(const id of ['bigJump','back0','back1','back2','back3']){const el=$(id),len=el.getTotalLength();el.dataset.length=len;el.style.strokeDasharray=len;el.style.strokeDashoffset=len;}
}
function buildSub(){
 const mobile=window.innerWidth<=520,w=mobile?350:1000,h=mobile?330:450;
 const x1=mobile?54:135,x2=mobile?250:780,shift=mobile?29:80,y=mobile?192:270,top=mobile?133:185;
 layout={mobile,x1,x2,shift,y,top};
 let b=ln(mobile?18:65,y,mobile?332:935,y);
 b+=`<g opacity=".4"><path d="M${x1} ${top+25}V${top}H${x2}V${top+25}" fill="none" stroke="#6d8979" stroke-width="3" stroke-dasharray="6 6"/>${ln(x1,y-9,x1,y+9)}${ln(x2,y-9,x2,y+9)}</g>`;
 b+=tx(x1,mobile?286:405,'38,996','label muted')+tx(x2,mobile?286:405,'71,003','label muted')+tx(mobile?175:500,mobile?316:438,'Original numbers','label muted');
 b+=`<g id="movingGap"><path d="M${x1} ${top+25}V${top}H${x2}V${top+25}" fill="none" stroke="#276c55" stroke-width="6"/>${ln(x1,y-12,x1,y+12)}${ln(x2,y-12,x2,y+12)}${tx(x1,y+48,'38,996','num','leftValue')}${tx(x2,y+48,'71,003','num','rightValue')}${tx((x1+x2)/2,top-24,'same gap','num green','gapValue')}</g>`;
 b+=path(`M${x1} ${mobile?60:90}h${shift}`,'leftArrow')+path(`M${x2} ${mobile?60:90}h${shift}`,'rightArrow');
 b+=`<g id="shiftLabels">${tx(x1+shift/2,mobile?35:55,'+4','label green')}${tx(x2+shift/2,mobile?35:55,'+4','label green')}</g>`;
 $('diagram').innerHTML=svg(b,w,h,'Both ends move four to the right together. The gap stays exactly the same size.');
 $('diagramNote').textContent='The movement is enlarged so you can see it.';
}
const row=(lab,content)=>`<div class="row"><div class="lab">${lab}</div><div class="formula">${content}</div></div>`;
function build(){
 $('method').textContent=topic==='add'?'Compensate':'Same difference';
 $('original').innerHTML=topic==='add'?'52,400 + 18,996 <span id="finalAnswer" class="currentresult"></span>':'71,003 − 38,996 <span id="finalAnswer" class="currentresult"></span>';
 $('working').innerHTML=topic==='add'?
 row('Make it easier','<div>18,996 <span class="extra">+ 4</span></div><div>= <span id="result0">19,000</span></div>')+row('Add','<div>52,400 + 19,000</div><div>= <span id="result1">71,400</span></div>')+row('Take back 4','<div>71,400 <span class="extra">− 4</span></div><div>= <span id="result2">71,396</span></div>'):
 row('Add 4 here','<div>38,996 + 4</div><div>= <span id="result0">39,000</span></div>')+row('And here','<div>71,003 + 4</div><div>= <span id="result1">71,007</span></div>')+row('Same gap','<div>71,007 − 39,000</div><div>= <span id="result2">32,007</span></div>');
 topic==='add'?buildAdd():buildSub();
 $('addition').setAttribute('aria-pressed',topic==='add');$('subtraction').setAttribute('aria-pressed',topic==='sub');lastCaption='';update();
}
function opacity(id,value){$(id).style.opacity=value;}
function revealPath(id,p){const el=$(id);el.style.opacity=p>0?1:0;el.style.strokeDashoffset=el.dataset.length*(1-clamp(p));}
function quad(a,c,b,p){return[(1-p)*(1-p)*a[0]+2*(1-p)*p*c[0]+p*p*b[0],(1-p)*(1-p)*a[1]+2*(1-p)*p*c[1]+p*p*b[1]]}
function setMarker(pt){$('marker').setAttribute('cx',pt[0]);$('marker').setAttribute('cy',pt[1]);}
function caption(s){if(lastCaption!==s){$('caption').textContent=s;lastCaption=s;}}
function rows(shown,active){document.querySelectorAll('.row').forEach((el,i)=>{el.classList.toggle('shown',shown.includes(i));el.classList.toggle('active',active.includes(i));});}
function update(){
 const t=elapsed/1000;
 if(topic==='add'){
  const round=clamp((t-3)/4),add=clamp((t-10)/4),back=clamp((t-18)/5);const n=Math.min(4,Math.floor(round*4));
  $('roundedAmount').textContent=fmt(18996+n);$('plusFour').textContent='4 extra';opacity('plusFour',round>=1?1:0);opacity('jumpLabel',t>=10?1:.15);opacity('backLabel',t>=18?1:.15);opacity('targetLabel',back>=1?1:.35);
  revealPath('bigJump',ease(add));for(let k=0;k<4;k++)revealPath('back'+k,clamp(back*4-k));
  if(back>0){const k=Math.min(3,Math.floor(back*4)),p=clamp(back*4-k),a=layout.ticks[4-k],b=layout.ticks[3-k],c=layout.mobile?[a[0]+73,(a[1]+b[1])/2]:[(a[0]+b[0])/2,a[1]-100];setMarker(quad(a,c,b,p));$('marker').setAttribute('fill','#965217');}
  else{setMarker(quad(layout.start,layout.ctrl,layout.end,ease(add)));$('marker').setAttribute('fill','#276c55');}
  rows(t<3?[]:t<10?[0]:t<18?[0,1]:[0,1,2],t<3?[]:t<10?[0]:t<18?[1]:t<25?[2]:[]);
  opacity('result0',round>=1?1:.12);opacity('result1',add>=1?1:.12);opacity('result2',back>=1?1:.12);
  if(t<3)caption('Start with 52,400 + 18,996. Watch what happens to the extra 4.');
  else if(t<10)caption('18,996 needs 4 more to make 19,000.');
  else if(t<18)caption('Add 19,000. We reach 71,400, but that includes 4 extra.');
  else if(t<25)caption('Take those 4 back: four small jumps to the correct total.');
  else caption('71,396. We added 4 extra, then took the same 4 back.');
  $('finalAnswer').textContent=t>=25?'= 71,396':'';
 }else{
  const p=clamp((t-7)/6),v=ease(p),n=Math.min(4,Math.floor(p*4));
  $('movingGap').setAttribute('transform',`translate(${v*layout.shift},0)`);
  $('leftValue').textContent=fmt(38996+n);$('rightValue').textContent=fmt(71003+n);
  for(const id of ['leftArrow','rightArrow','shiftLabels'])opacity(id,t>=3?1:0);
  $('gapValue').textContent=t>=19?'32,007':t>=3?'same gap':'Find the gap';
  rows(t<3?[]:t<19?[0,1]:[0,1,2],t<3?[]:t<15?[0,1]:t<25?[2]:[]);
  opacity('result0',p>=1?1:.12);opacity('result1',p>=1?1:.12);opacity('result2',t>=19?1:.12);
  if(t<3)caption('Subtraction finds the distance between these two numbers.');
  else if(t<7)caption('Make 38,996 easier by adding 4. Add 4 to the other number too.');
  else if(t<15)caption('Both ends move together. Watch: the gap does not stretch or shrink.');
  else if(t<19)caption('Now find 71,007 − 39,000.');
  else if(t<25)caption('71 thousand − 39 thousand = 32 thousand. Keep the 7.');
  else caption('32,007. The gap is unchanged, so there is nothing to take back.');
  $('finalAnswer').textContent=t>=25?'= 32,007':'';
 }
 $('progress').value=elapsed;$('time').textContent=`0:${String(Math.floor(t)).padStart(2,'0')} / 0:29`;
 $('play').textContent=playing?'Pause':elapsed>=total?'Replay animation':elapsed>0?'Continue':'Play animation';
}
function tick(now){if(!playing)return;if(last)elapsed=Math.min(total,elapsed+now-last);last=now;if(elapsed>=total)playing=false;update();if(playing)raf=requestAnimationFrame(tick);}
function pause(){playing=false;last=0;if(raf)cancelAnimationFrame(raf);update();}
$('play').onclick=()=>{if(playing){pause();return;}if(elapsed>=total)elapsed=0;playing=true;last=0;update();raf=requestAnimationFrame(tick);};
$('restart').onclick=()=>{pause();elapsed=0;update();};
$('progress').oninput=e=>{const value=Number(e.target.value);pause();elapsed=value;update();};
function choose(value){pause();topic=value;elapsed=0;build();}
$('addition').onclick=()=>choose('add');$('subtraction').onclick=()=>choose('sub');
window.matchMedia('(max-width:520px)').addEventListener('change',()=>build());
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});build();
</script></body></html>
