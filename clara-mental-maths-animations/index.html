<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clara · Mental maths, one step at a time</title>
<style>
:root{--ink:#273f37;--green:#276c55;--mint:#def0e7;--line:#b7d3c5;--paper:#fffefb;--amber:#a45c19;--peach:#fae7ce;--muted:#5f7269}
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{max-width:1640px;margin:auto;padding:22px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.brand{font-size:18px;color:var(--muted)}nav{display:flex;gap:10px}button{font:700 26px Arial;cursor:pointer;min-height:50px;border:2px solid var(--line);border-radius:14px;background:white;color:var(--ink);padding:10px 22px}button:focus-visible{outline:3px solid #986221;outline-offset:4px}button:disabled{opacity:.4;cursor:default}nav button[aria-pressed=true],.next{background:var(--green);border-color:var(--green);color:white}.sheet{background:var(--paper);border:1px solid #d5dfd6;border-radius:26px;padding:26px 34px;box-shadow:0 6px 24px #233c3106}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;color:var(--muted);font-size:17px}.method{text-transform:uppercase;letter-spacing:.08em;font-weight:700}.progress{display:flex;gap:7px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:#dde5de}.dot.on{background:var(--green)}#count{margin-left:8px;white-space:nowrap}h1{font-size:clamp(28px,3vw,42px);line-height:1.15;margin:20px 0 10px;letter-spacing:-.025em}#explain{font-size:clamp(26px,2vw,30px);line-height:1.35;margin:0;min-height:36px;color:var(--muted)}#equation{font-size:clamp(30px,4vw,55px);font-weight:700;letter-spacing:-.025em;margin:20px 0 8px;min-height:65px;font-variant-numeric:tabular-nums}.answer{color:var(--green)}.extra{color:var(--amber)}.diagram{min-height:280px;display:flex;align-items:center;justify-content:center;background:#f2f8f4;border-radius:20px;margin:14px 0 8px;overflow:hidden}svg{display:block;width:100%;height:auto;max-height:290px}svg text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.num{font-size:35px;font-weight:700;font-variant-numeric:tabular-nums}.label{font-size:25px}.small{font-size:20px;fill:var(--muted)}.green{fill:var(--green)}.orange{fill:var(--amber)}.track{stroke:#acc4b6;stroke-width:3}.caption{text-align:center;font-size:22px;color:var(--muted);min-height:20px;margin:8px 0 2px}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}.leftcontrols{display:flex;gap:10px}.hint{font-size:16px;color:var(--muted);text-align:center;margin:14px 0 0}.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.8s ease-in-out forwards}.stepin{opacity:0;animation:appear .65s ease forwards;animation-delay:var(--delay,0s)}.shift{animation:shift 3s ease-in-out forwards}.after{opacity:0;animation:appear .4s 3s forwards}.before{animation:vanish .3s 2.7s forwards}.moving-dot{offset-rotate:0deg;animation:travel 3.2s ease-in-out forwards;offset-distance:0%}.fade{animation:appear .8s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}@keyframes appear{to{opacity:1}}@keyframes shift{to{transform:translateX(var(--travel,70px))}}@keyframes vanish{to{opacity:0}}@keyframes travel{to{offset-distance:100%}}.footer-note{font-size:14px;color:var(--muted);margin-top:14px;text-align:center}
@media(min-width:701px) and (max-height:850px){main{padding:12px 24px}header{margin-bottom:10px}.sheet{padding:18px 28px}.topline{font-size:16px}h1{margin:14px 0 8px;font-size:36px}#equation{margin:12px 0 4px;min-height:54px;font-size:46px}.diagram{min-height:230px;margin:8px 0 4px}svg{max-height:240px}.controls{margin-top:12px}.hint{margin:8px 0 0}.caption{margin:4px 0 0;font-size:20px;min-height:23px}}
@media(min-width:1600px){main{padding-top:32px}.sheet{padding:34px 44px}.diagram{min-height:340px}svg{max-height:370px}h1{font-size:46px}}
@media(max-width:700px){main{padding:12px}header{display:block;margin-bottom:12px}.brand{font-size:16px;margin:2px 0 12px}nav button{flex:1;font-size:17px;padding:9px}nav{gap:8px}.sheet{padding:20px 14px;border-radius:20px}.topline{font-size:14px}.method{letter-spacing:.025em}.progress{gap:4px}.dot{width:7px;height:7px}h1{margin-top:20px;font-size:29px}#equation{font-size:clamp(25px,6.6vw,42px);min-height:44px;margin-top:20px}#explain{font-size:20px;min-height:54px}.diagram{min-height:235px;margin-top:15px}svg{min-height:0;max-height:none}.diagram{padding:10px 0}.num{font-size:26px}.label{font-size:21px}.small{font-size:18px}.caption{font-size:14px;min-height:34px}.controls{flex-wrap:wrap;margin-top:14px}.leftcontrols{flex:1}button{font-size:17px;padding:10px 15px}.next{min-width:105px}.hint{font-size:14px}.num{font-size:32px}}
@media(prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.stepin,.after{animation:none;opacity:1}.before{display:none}.shift{animation:none;transform:translateX(var(--travel,70px))}.moving-dot{animation:none;offset-distance:100%}}
@media(min-width:900px){main{padding-left:48px;padding-right:48px}.brand,.topline,.caption,.hint{font-size:26px}#explain{font-size:28px}.label,.small{font-size:32px}.num{font-size:37px}}
</style>
</head>
<body>
<main>
<header><div class="brand">Clara · One step at a time</div><nav aria-label="Choose an explanation"><button id="addition" aria-pressed="true">Addition</button><button id="subtraction" aria-pressed="false">Subtraction</button></nav></header>
<section class="sheet" aria-label="Animated worked example">
<div class="topline"><span class="method" id="method"></span><div class="progress"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="count"></span></div></div>
<div id="words" aria-live="polite" aria-atomic="true"><h1 id="title"></h1><p id="explain"></p><div id="equation"></div></div>
<div id="picture" class="diagram"></div><p id="caption" class="caption"></p>
<div class="controls"><div class="leftcontrols"><button id="back">Back</button><button id="replay" aria-label="Replay this step">Replay step</button></div><button id="next" class="next">Next step →</button></div>
<p class="hint">Press Next step when you are ready.</p>
</section>

</main>
<script>
'use strict';
let topic='add', step=0;
const $=id=>document.getElementById(id);
const t=(x,y,s,cls='num',anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}">${s}</text>`;
const line=(x1,y1,x2,y2,cls='track')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;
const narrow=()=>window.innerWidth<=700;
const svg=(body,label,box='0 0 1000 290')=>`<svg viewBox="${box}" role="img" aria-label="${label}"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#276c55"/></marker></defs>${body}</svg>`;
function units(start,reverse=false){
 if(narrow()){
   const ys=[38,104,170,236,302];let b=line(120,24,120,316);
   ys.forEach((y,i)=>{b+=line(110,y,130,y)+t(215,y+9,(start+i).toLocaleString('en-GB'))});
   (reverse?[4,3,2,1]:[0,1,2,3]).forEach((i,k)=>{const y2=ys[reverse?i-1:i+1];b+=`<g class="stepin" style="--delay:${.4+k*.85}s"><path d="M105 ${ys[i]} Q35 ${(ys[i]+y2)/2} 105 ${y2}" fill="none" stroke="#276c55" stroke-width="3" marker-end="url(#arrow)"/>${t(39,(ys[i]+y2)/2+7,reverse?'−1':'+1','label green')}</g>`});
   return svg(b,reverse?'Four steps back, one at a time.':'Four steps forward, one at a time.','0 0 350 340');
 }

 let body=line(120,180,880,180);
 const xs=[160,330,500,670,840];
 xs.forEach((x,i)=>{body+=line(x,171,x,191)+t(x,232,(start+i).toLocaleString('en-GB'),'num')});
 const order=reverse?[4,3,2,1]:[0,1,2,3];
 order.forEach((i,k)=>{const end=reverse?xs[i-1]:xs[i+1];body+=`<g class="stepin" style="--delay:${.4+k*.85}s"><path d="M${xs[i]} 160 Q${(xs[i]+end)/2} 70 ${end} 160" fill="none" stroke="#276c55" stroke-width="5" marker-end="url(#arrow)"/>${t((xs[i]+end)/2,99,reverse?'−1':'+1','label green')}</g>`});
 body+=t(500,37,reverse?'Four small steps back':'Four small steps forward','label');
 return svg(body,reverse?`Start at ${(start+4).toLocaleString()}. Take away one four times, ending at ${start.toLocaleString()}.`:`Start at ${start.toLocaleString()}. Add one four times, ending at ${(start+4).toLocaleString()}.`);
}
function blocks(){if(narrow())return svg(`<rect x="30" y="25" width="290" height="75" rx="14" fill="#d3e9dc"/>${t(175,74,'52,400')}${t(175,143,'+')}<rect x="30" y="165" width="290" height="75" rx="14" fill="#e3eee7"/>${t(175,214,'18,996')}`,'Add 52,400 and 18,996.','0 0 350 265');return svg(`<rect x="90" y="90" width="480" height="110" rx="16" fill="#d3e9dc"/><rect x="590" y="90" width="320" height="110" rx="16" fill="#e3eee7"/>${t(330,156,'52,400')}${t(750,156,'18,996')}${t(580,158,'+','label')}${t(500,253,'Put the two amounts together.','label')}`,'Two amounts to add: 52,400 and 18,996.');}
function additionJump(){if(narrow())return svg(`${line(25,175,325,175)}${t(65,214,'52,400')}${t(285,214,'71,400')}<path d="M65 155 Q175 10 285 155" fill="none" stroke="#276c55" stroke-width="4" marker-end="url(#arrow)" class="draw"/>${t(175,45,'+19,000','num green')}${t(175,264,'Includes 4 extra','label orange')}`,'Add 19,000, including four extra.','0 0 350 290');return svg(`${line(100,194,900,194)}${line(160,182,160,208)}${line(840,182,840,208)}${t(160,252,'52,400')}${t(840,252,'71,400')}<path d="M160 170 Q500 -30 840 170" fill="none" stroke="#276c55" stroke-width="7" marker-end="url(#arrow)" class="draw"/>${t(500,60,'+19,000','num green')}<rect x="365" y="115" width="270" height="48" rx="12" fill="#fae7ce"/>${t(500,148,'Includes 4 extra','label orange')}`,'Add 19,000 to 52,400 to reach 71,400. This includes four extra.');}
function additionEnd(){if(narrow())return svg(`${t(175,50,'52,400 + 19,000','num')}${t(175,90,'= 71,400','num green')}${t(175,156,'Take away the extra 4','label orange')}${t(175,219,'71,400 − 4','num')}${t(175,259,'= 71,396','num green')}`,'Add the easier amount, then remove four.','0 0 350 290');return svg(`<rect x="75" y="55" width="850" height="78" rx="16" fill="#e0eee5"/>${t(500,106,'52,400 + 19,000 = 71,400')}${t(500,184,'4 too many → take away 4','label orange')}${t(500,252,'71,400 − 4 = 71,396','num green')}`,'Adding 19,000 gives 71,400. Remove the extra four to get 71,396.');}
function gap(shift=false,answer=false){
 if(narrow()){
  let b=line(20,181,330,181);
  if(shift){
   b+=`<g opacity=".28"><path d="M65 145 V120 H255 V145" fill="none" stroke="#6d8c7b" stroke-width="3" stroke-dasharray="5 5"/></g><g class="before">${t(65,226,'38,996')}${t(255,226,'71,003')}</g>`;
   b+=`<g class="shift" style="--travel:25px"><path d="M65 145 V120 H255 V145" fill="none" stroke="#276c55" stroke-width="5"/>${line(65,172,65,192)}${line(255,172,255,192)}${t(160,98,'same gap','label green')}<g class="after">${t(65,226,'39,000')}${t(255,226,'71,007')}</g></g>`;
   for(const x of [65,255])b+=`<path d="M${x} 52 h25" fill="none" stroke="#276c55" stroke-width="3" marker-end="url(#arrow)"/>${t(x+12,30,'+4','label green')}`;
  }else{b+=`<path d="M65 145 V120 H255 V145" fill="none" stroke="#276c55" stroke-width="5"/>${line(65,172,65,192)}${line(255,172,255,192)}${t(160,91,answer?'32,007':'Find the gap','label green')}${t(65,226,answer?'39,000':'38,996')}${t(255,226,answer?'71,007':'71,003')}`;}
  return svg(b,shift?'Add four to both numbers. The gap does not change.':'The distance between the two numbers.','0 0 350 260');
 }

 let body=line(60,205,940,205);
 if(shift){body+=`<g opacity=".28">${line(140,190,140,216)}${line(790,190,790,216)}<path d="M140 155 V125 H790 V155" fill="none" stroke="#6d8c7b" stroke-width="3" stroke-dasharray="7 7"/></g>`;
 body+=`<g class="before">${t(140,263,'38,996')}${t(790,263,'71,003')}</g><g class="shift"><path d="M140 155 V125 H790 V155" fill="none" stroke="#276c55" stroke-width="7"/>${line(140,186,140,219)}${line(790,186,790,219)}${t(465,95,answer?'32,007':'same gap','num green')}<g class="after">${t(140,263,'39,000')}${t(790,263,'71,007')}</g></g>`;
 body+=`<path d="M140 46 H210" fill="none" stroke="#276c55" stroke-width="4" marker-end="url(#arrow)"/><path d="M790 46 H860" fill="none" stroke="#276c55" stroke-width="4" marker-end="url(#arrow)"/>${t(175,30,'+4','label green')}${t(825,30,'+4','label green')}`;
 }else body+=`<path d="M140 155 V115 H790 V155" fill="none" stroke="#276c55" stroke-width="6"/>${line(140,186,140,219)}${line(790,186,790,219)}${t(465,82,answer?'32,007':'How big is the gap?','num green')}${t(140,263,answer?'39,000':'38,996')}${t(790,263,answer?'71,007':'71,003')}`;
 return svg(body,shift?'Both ends of the gap move four to the right. 38,996 becomes 39,000; 71,003 becomes 71,007. The gap stays the same.':answer?'The gap from 39,000 to 71,007 is 32,007.':'Find the gap from 38,996 to 71,003.');
}
function sameEnd(){if(narrow())return svg(`${t(18,27,'Before','small','start')}${t(65,69,'38,996')}${t(255,69,'71,003')}<path d="M65 81 V110 H255 V81" fill="none" stroke="#7c9989" stroke-width="4"/>${t(160,101,'32,007','label green')}${t(18,173,'After +4 to both','small','start')}${t(90,215,'39,000')}${t(280,215,'71,007')}<path d="M90 227 V257 H280 V227" fill="none" stroke="#276c55" stroke-width="4"/>${t(185,249,'32,007','label green')}`,'The gap is 32,007 before and after.','0 0 350 280');return svg(`${t(75,39,'Before','small','start')}${t(145,83,'38,996')}${t(795,83,'71,003')}<path d="M145 95 V115 H795 V95" fill="none" stroke="#7c9989" stroke-width="5"/>${t(470,105,'32,007','label green')}${t(75,182,'After +4 to both','small','start')}${t(215,225,'39,000')}${t(865,225,'71,007')}<path d="M215 237 V263 H865 V237" fill="none" stroke="#276c55" stroke-width="5"/>${t(540,253,'32,007','label green')}`,'Before: the gap from 38,996 to 71,003 is 32,007. After adding four to both: the gap from 39,000 to 71,007 is still 32,007.');}
const lessons={add:[
 {title:'Make the addition easier.',explain:'19,000 is much easier to add than 18,996.',equation:'52,400 + 18,996',draw:blocks,caption:'The blocks show the two amounts. Sketch, not to scale.'},
 {title:'Add 4 to make 19,000.',explain:'Count the four small steps.',equation:'18,996 <span class="extra">+ 4</span> = 19,000',draw:()=>units(18996),caption:'A close-up: each small jump adds 1.'},
 {title:'Now add the easier number.',explain:'We are adding 4 more than we need.',equation:'52,400 + 19,000 = <span class="answer">71,400</span>',draw:additionJump,caption:'The large jump is a sketch, not to scale.'},
 {title:'Take the extra 4 back.',explain:'We added too much, so we subtract 4.',equation:'71,400 <span class="extra">− 4</span> = <span class="answer">71,396</span>',draw:()=>units(71396,true),caption:'A close-up at the end: four small steps back.'},
 {title:'That is compensation.',explain:'Add an easier amount. Then remove the extra.',equation:'52,400 + 18,996 = <span class="answer">71,396</span>',draw:additionEnd,caption:''}
],sub:[
 {title:'Subtraction finds the gap.',explain:'How far is it from 38,996 to 71,003?',equation:'71,003 − 38,996',draw:()=>gap(),caption:'A sketch of the gap, not to scale.'},
 {title:'39,000 is only 4 away.',explain:'This will be an easier number to subtract.',equation:'38,996 <span class="extra">+ 4</span> = 39,000',draw:()=>units(38996),caption:'A close-up: each small jump adds 1.'},
 {title:'Add 4 to BOTH numbers.',explain:'Both ends move together. The gap stays the same.',equation:'<span class="answer">71,007 − 39,000</span>',draw:()=>gap(true),caption:'The movement is enlarged so you can see it.'},
 {title:'Now subtract 39,000.',explain:'71 thousand − 39 thousand = 32 thousand. Keep the 7.',equation:'71,007 − 39,000 = <span class="answer">32,007</span>',draw:()=>gap(false,true),caption:'The gap is 32,007.'},
 {title:'The same difference.',explain:'Both numbers increased by 4. The answer stayed the same.',equation:'71,003 − 38,996 = <span class="answer">32,007</span>',draw:sameEnd,caption:'Both gaps have exactly the same length. Sketch, not to scale.'}
]};
function render(){const d=lessons[topic][step];$('method').textContent=topic==='add'?'Compensate':'Same difference';$('title').textContent=d.title;$('explain').textContent=d.explain;$('equation').innerHTML=d.equation;$('picture').innerHTML=d.draw();$('caption').textContent=d.caption;$('count').textContent=`${step+1} / 5`;$('back').disabled=step===0;$('next').textContent=step===4?'Start again ↺':'Next step →';document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('on',i<=step));$('addition').setAttribute('aria-pressed',topic==='add');$('subtraction').setAttribute('aria-pressed',topic==='sub');}
$('addition').onclick=()=>{topic='add';step=0;render()};$('subtraction').onclick=()=>{topic='sub';step=0;render()};$('back').onclick=()=>{if(step>0){step--;render()}};$('next').onclick=()=>{step=(step+1)%5;render()};window.matchMedia('(max-width:700px)').addEventListener('change',render);$('replay').onclick=()=>{$('picture').innerHTML=lessons[topic][step].draw()};render();
</script>
</body></html>
